apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-sc
  annotations:
    # 이 클래스를 기본(Default) 저장소로 설정합니다.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com # 드라이버 파드와 이름을 맞춰줍니다!
parameters:
  type: gp3 # 성능이 더 좋고 저렴한 gp3를 추천합니다. (gp2도 가능)
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer # 파드가 뜰 때 볼륨을 생성하도록 대기
