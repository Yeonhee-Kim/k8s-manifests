apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-viewer
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-node-viewer
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-viewer-binding
subjects:
- kind: ServiceAccount
  name: platform-viewer
  namespace: app
roleRef:
  kind: ClusterRole
  name: pod-node-viewer
  apiGroup: rbac.authorization.k8s.io
